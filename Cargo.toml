[workspace]
resolver = "3"
members = ["shared", "backend", "frontend"]
# The frontend only builds for wasm32 (via trunk), so plain `cargo build/test` skips it.
default-members = ["shared", "backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "thin"

# The wasm bundle is what visitors download, so optimize the frontend for size.
[profile.release.package.frontend]
opt-level = "z"
codegen-units = 1
