# Troop 15 greenery fundraiser catalog (Sherwood Forest Farms, 2026 season).
# Loaded at startup; restart to apply changes. Validate with: t15-fundraiser check-catalog
# Ids are the vendor item numbers. Prices are the troop's retail prices from the SFF dashboard.

# Orders are rejected after this moment (RFC 3339, explicit offset). EDT = -04:00.
closes_at: "2026-10-30T23:59:59-04:00"

delivery_note: "Scout-delivered items will be brought to your door Nov 16-24, 2026."
shipping_note: "Gift items are packaged individually and shipped fresh directly to the recipient during the first 2 weeks after Thanksgiving (contiguous U.S. only). Delivery dates are not guaranteed."

fulfillment:
  # A delivery ZIP is local if it starts with any prefix or exactly matches an entry.
  # TODO(chad): 441 covers Cuyahoga only. Add 440, 442, 443 for Lake/Lorain/Geauga/Summit/Medina.
  local_zip_prefixes: ["441"]
  local_zips: []

# price_cents is all-in (shipping and any tax included).
# image: filename in static/images/ (required). fulfillment: scout_delivery | direct_ship
