<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Troop 15 Greenery Fundraiser</title>
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" />

  <body>
    <!-- Splash shown until the wasm app starts; main() removes it. -->
    <div id="boot" style="text-align:center;padding:4rem 1rem;font-family:system-ui,sans-serif;color:#1f5c3a">
      <div style="width:2.5rem;height:2.5rem;margin:0 auto 1rem;border:4px solid #d6dbd4;border-top-color:#1f5c3a;border-radius:50%;animation:boot-spin 1s linear infinite"></div>
      Loading the Troop 15 greenery fundraiser…
    </div>
    <style>@keyframes boot-spin{to{transform:rotate(360deg)}}</style>
  </body>
</html>
